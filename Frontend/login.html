
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-900">
                RPS<span class="text-blue-600">.</span>
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Result Processing System
            </p>
        </div>

        <h2 class="mb-2 text-2xl font-bold text-slate-800">
            Welcome Back
        </h2>

        <p class="mb-6 text-sm text-slate-500">
            Sign in to access your dashboard.
        </p>

        <form id="loginForm" class="space-y-5">

            <div>
                <label for="username"
                    class="mb-2 block text-sm font-medium text-slate-700">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your username"
                    required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">
            </div>

            <div>
                <label for="password"
                    class="mb-2 block text-sm font-medium text-slate-700">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password"
                    required
                    class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">
            </div>

            <p id="loginMessage" class="text-sm text-red-600"></p>

            <button
                id="loginButton"
                type="submit"
                class="w-full rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700">
                Sign In
            </button>

        </form>

        <p class="mt-8 text-center text-xs text-slate-400">
            IST · Academic Management
        </p>

    </div>

    <script src="login.js"></script>

</body>
</html>
